const EMOJIS = ['☀️', '🌙', '💪', '🧘', '📚', '🏃', '🥗', '💧', '🎯', '✍️', '🧠', '🛏️', '🚿', '☕', '🎧', '🌿', '🙏', '🧹', '💼', '🎓', '❤️', '⭐', '🔥', '🌅', '🚴', '🎸', '💊', '📵'];
function daysText(days) {
  if (!days || !days.length || days.length === 7) return 'Täglich';
  const s = [...days].sort().join(',');
  if (s === '1,2,3,4,5') return 'Mo–Fr'; if (s === '0,6') return 'Wochenende';
  return WEEK_ORDER.filter(d => days.includes(d)).map(d => WD_SHORT[d]).join(', ');
}
function routineStreak(r) {
  let n = 0; const today = startOfDay(new Date());
  let d = r.steps.length && stepsDone(r, dkey(today)) === r.steps.length ? today : addDays(today, -1);
  for (let g = 0; g < 1000; g++, d = addDays(d, -1)) {
    if (r.days && r.days.length && !r.days.includes(d.getDay())) continue;
    if (r.steps.length && stepsDone(r, dkey(d)) === r.steps.length) n++; else break;
  }
  return n;
}
const Habits = {
  toggle(id, key) { const hb = Data.get('habits', id); if (!hb) return false; if (hb.log[key]) delete hb.log[key]; else hb.log[key] = 1; Data.upsert('habits', hb); Nav.update(); return !!hb.log[key]; }
};
const habitScheduled = (hb, d) => hb.freq?.type === 'days' ? (hb.freq.days || []).includes(d.getDay()) : true;
function rhythmText(hb) {
  const f = hb.freq || { type: 'daily' };
  return f.type === 'weekly' ? `${f.times || 3}× pro Woche` : f.type === 'days' ? daysText(f.days) : 'Täglich';
}
function habitStats(hb) {
  const log = hb.log || {}, today = startOfDay(new Date()), f = hb.freq || { type: 'daily' };
  const keys = Object.keys(log).sort(); const first = keys.length ? parseKey(keys[0]) : today;
  if (f.type === 'weekly') {
    const times = f.times || 3, wk0 = startOfWeek(today);
    const cw = ws => { let c = 0; for (let i = 0; i < 7; i++) if (log[dkey(addDays(ws, i))]) c++; return c; };
    let cur = cw(wk0) >= times ? 1 : 0, ws = addDays(wk0, -7);
    while (cur < 520 && cw(ws) >= times && ws >= startOfWeek(first)) { cur++; ws = addDays(ws, -7); }
    let best = cur, run = 0;
    for (let w = startOfWeek(first); w <= wk0; w = addDays(w, 7)) { if (cw(w) >= times) { run++; best = Math.max(best, run); } else if (w < wk0) run = 0; }
    let sum = 0; for (let i = 0; i < 4; i++) sum += Math.min(times, cw(addDays(wk0, -7 * i)));
    return { current: cur, best, rate: Math.round(sum / (4 * times) * 100), unit: 'w' };
  }
  let cur = 0, d = log[dkey(today)] ? today : addDays(today, -1);
  for (let g = 0; g < 3650 && d >= first; g++, d = addDays(d, -1)) { if (!habitScheduled(hb, d)) continue; if (log[dkey(d)]) cur++; else break; }
  let best = cur, run = 0;
  for (let x = new Date(first); x <= today; x = addDays(x, 1)) {
    if (!habitScheduled(hb, x)) continue;
    if (log[dkey(x)]) { run++; best = Math.max(best, run); } else if (dkey(x) !== dkey(today)) run = 0;
  }
  const created = hb.created ? startOfDay(new Date(hb.created)) : first;
  const ws = new Date(Math.max(addDays(today, -29).getTime(), Math.min(created.getTime(), first.getTime())));
  let sch = 0, dn = 0;
  for (let x = new Date(ws); x <= today; x = addDays(x, 1)) {
    const k = dkey(x), s = habitScheduled(hb, x);
    if (s && (k !== dkey(today) || log[k])) sch++;
    if (s && log[k]) dn++;
  }
  return { current: cur, best, rate: sch ? Math.round(dn / sch * 100) : 0, unit: 'd' };
}
function heatHTML(hb) {
  const today = startOfDay(new Date()), tk = dkey(today), start = addDays(startOfWeek(today), -52 * 7);
  let html = '', col = 0, lastM = -1;
  for (let w = new Date(start); w <= today; w = addDays(w, 7), col++) {
    const mo = addDays(w, 6).getMonth(); let label = '';
    if (mo !== lastM) { label = MONTHS_SHORT[mo].replace('.', ''); lastM = mo; }
    html += `<span class="ml" aria-hidden="true">${col === 0 ? '' : label}</span>`;
    for (let r = 0; r < 7; r++) {
      const d = addDays(w, r), k = dkey(d), fut = d > today, done = !!hb.log[k], sch = habitScheduled(hb, d);
      html += `<button type="button" class="c ${fut ? 'future' : ''} ${done ? 'l3' : ''} ${!sch && !done ? 'off' : ''} ${k === tk ? 'today' : ''}" data-hcell="${k}" style="--d:${col * 2 + r * .7}" title="${fmtDateMid(d)}${done ? ' · erledigt' : ''}" tabindex="-1" aria-label="${fmtDateMid(d)} ${done ? 'erledigt' : 'offen'}"></button>`;
    }
  }
  return html;
}
function habitStatsHTML(hb) {
  const st = habitStats(hb);

}

/* Fokusmodus: Routine Schritt für Schritt mit großem Timer */
const Focus = {
  el: null,
  open(rid) {
    const r = Data.get('routines', rid);
    if (!r || !r.steps.length) { toast('Diese Routine hat noch keine Schritte'); return; }
    this.close(true);
    this.r = r; this.key = todayKey();
    this.idx = Math.max(0, r.steps.findIndex(s => !isStepDone(r.id, s.id, this.key)));
    if (r.steps.every(s => isStepDone(r.id, s.id, this.key))) this.idx = 0;
    this.elapsed = 0; this.running = true; this.last = performance.now(); this.alerted = false; this.finished = false;
    this.el = h('div', { class: 'focus-overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': `Fokusmodus ${r.name}` });
    document.body.append(this.el); document.body.style.overflow = 'hidden';
    this.render(false);
    this.el.addEventListener('click', e => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      const a = b.dataset.f; if (a === 'next') this.next(); else if (a === 'prev') this.prev(); else if (a === 'pause') this.toggle(); else if (a === 'close') this.close();
    });
    this.keyH = e => {
      if (!this.el) return;
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); this.finished ? this.close() : this.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.prev(); }
      else if (e.key.toLowerCase() === 'p') this.toggle();
      else if (e.key === 'Escape') { e.preventDefault(); this.close(); }
      e.stopPropagation();
    };
    window.addEventListener('keydown', this.keyH, true);
    this.timer = setInterval(() => this.tick(), 250);
  },
  step() { return this.r.steps[this.idx]; },
  render(swap) {
    const r = this.r, s = this.step();
    this.el.innerHTML = `<button class="btn icon f-close" data-f="close" aria-label="Fokusmodus beenden (Esc)">${ico('x')}</button>
      <div class="small muted" style="font-weight:600;letter-spacing:.06em;text-transform:uppercase">${esc(r.emoji || '')} ${esc(r.name)} · Schritt ${this.idx + 1} von ${r.steps.length}</div>
      <div class="f-dots" aria-hidden="true">${r.steps.map((x, i) => `<i class="${i < this.idx || isStepDone(r.id, x.id, this.key) ? 'on' : ''}"></i>`).join('')}</div>
      <div class="f-step ${swap ? 'swap' : ''}" aria-live="polite">${esc(s.text)}</div>
      <div class="ring big" id="fRing" style="width:240px;height:240px">${ring(0, 240, 10).replace(/^<div[^>]*>|<\/div>$/g, '')}<span class="label"><span class="f-timer" id="fTime">00:00</span></span></div>
      <div class="row" style="gap:12px">
        <button class="btn icon" data-f="prev" aria-label="Zurück (←)" ${this.idx === 0 ? 'disabled' : ''}>${ico('left')}</button>
        <button class="btn icon" data-f="pause" aria-label="Pause (P)">${ico(this.running ? 'pause' : 'play')}</button>
        <button class="btn primary" data-f="next" style="height:48px;padding:0 28px;font-size:16px">${this.idx === r.steps.length - 1 ? 'Abschließen' : 'Weiter'} ${ico('right', 'sm')}</button>
      </div>
      <div class="f-next">${this.idx < r.steps.length - 1 ? `Als Nächstes: ${esc(r.steps[this.idx + 1].text)}` : 'Letzter Schritt'} · <span class="kbd">Leertaste</span> weiter</div>`;
    const p = $('#fRing .prog', this.el); if (p) p.style.transition = 'stroke-dashoffset .3s linear';
    this.tick(true);
    $('[data-f="next"]', this.el).focus();
  },
  tick(force) {
    if (!this.el || this.finished) return;
    const now = performance.now(); if (this.running) this.elapsed += (now - this.last) / 1000; this.last = now;
    const s = this.step(), total = (+s.min || 0) * 60, t = $('#fTime', this.el), rg = $('#fRing', this.el); if (!t) return;
    const fmt = sec => `${pad(Math.floor(sec / 60))}:${pad(Math.floor(sec % 60))}`;
    if (total) {
      const rem = total - this.elapsed;
      t.textContent = rem >= 0 ? fmt(rem) : '+' + fmt(-rem); t.style.color = rem < 0 ? 'var(--accent)' : '';
      setRing(rg, Math.min(1, this.elapsed / total));
      if (rem < 0 && !this.alerted) { this.alerted = true; chime(); }
    } else { t.textContent = fmt(this.elapsed); setRing(rg, (this.elapsed % 60) / 60); }
    void force;
  },
  markCurrent() { const s = this.step(); if (!isStepDone(this.r.id, s.id, this.key)) toggleStep(this.r.id, s.id, this.key); },
  next() {
    this.markCurrent();
    if (this.idx >= this.r.steps.length - 1) { this.finish(); return; }
    this.idx++; this.elapsed = 0; this.alerted = false; this.render(true);
  },
  prev() { if (this.idx === 0) return; this.idx--; this.elapsed = 0; this.alerted = false; this.render(true); },
  toggle() { this.running = !this.running; this.last = performance.now(); const b = $('[data-f="pause"]', this.el); if (b) b.innerHTML = ico(this.running ? 'pause' : 'play'); },
  finish() {
    this.r.steps.forEach(s => { if (!isStepDone(this.r.id, s.id, this.key)) toggleStep(this.r.id, s.id, this.key); });
    this.finished = true;
    this.el.innerHTML = `<div style="font-size:64px" aria-hidden="true">${esc(this.r.emoji || '🌿')}</div><div class="f-step swap">Geschafft!</div>
      <p class="muted">${esc(this.r.name)} ist für heute erledigt. ${routineStreak(this.r) > 1 ? `Das sind ${routineStreak(this.r)} Tage in Folge.` : 'Guter Start!'}</p>
      <button class="btn primary" data-f="close" style="height:48px;padding:0 28px">Zurück zum Planer</button>`;
    $('[data-f="close"]', this.el).focus();
    confetti(innerWidth / 2, innerHeight / 2.4, 180); setTimeout(() => confetti(innerWidth / 3, innerHeight / 2, 80), 350); setTimeout(() => confetti(innerWidth * 2 / 3, innerHeight / 2, 80), 600);
  },
  close(silent) {
    if (!this.el) return;
    clearInterval(this.timer); window.removeEventListener('keydown', this.keyH, true);
    const el = this.el; this.el = null; document.body.style.overflow = '';
    el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300);
    if (!silent) App.refresh();
  }
};

const Templates = {
  all() { return [...BUILTIN_TEMPLATES, ...(S.meta.templates?.items || [])]; },
  fill(text, { titel = '', datum = new Date() } = {}) {
    const d = datum instanceof Date ? datum : parseKey(datum);
    return String(text).replace(/\{\{(\w+)\}\}/g, (m, k) => ({
      titel, datum: `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`, kurzdatum: `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`,
      wochentag: WD_LONG[d.getDay()], kw: isoWeek(d).week, uhrzeit: fmtTime(new Date()), jahr: d.getFullYear()
    }[k] ?? m));
  },
  async create(tplId, extra = {}) {
    const t = this.all().find(x => x.id === tplId); if (!t) return null;

/* ============ 10f. RÜCKBLICK & STATISTIKEN (eigene SVG-Diagramme) ============ */
const Charts = {

      const x = pl + i * band + (band - bw) / 2, v = d.value || 0, hgt = v / mx * ih, y = pt + ih - hgt, r = Math.min(4, bw / 2, hgt);
      if (v > 0) b += `<path class="bar" style="--i:${i};fill:${color}" d="M${x},${pt + ih} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${pt + ih} Z"/>`;
      if (i % every === 0) lab += `<text x="${pl + i * band + band / 2}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;

  },
  /* Linien: 2px, Marker 8px, Fadenkreuz + Tooltip, direkte Beschriftung am Ende */

    const X = i => pl + (n === 1 ? iw / 2 : i * iw / (n - 1)), Y = v => pt + ih - (v - min) / (max - min) * ih;

/* ============ 11. COMMAND PALETTE, TASTENKÜRZEL, HILFE ============ */
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function hl(text, q) {
  const t = String(text || ''); if (!q) return esc(t);
  const i = norm(t).indexOf(norm(q)); if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}
function snippet(text, q) { const p = mdPlain(text), i = norm(p).indexOf(norm(q)); if (i < 0) return ''; const s = Math.max(0, i - 30); return (s ? '…' : '') + p.slice(s, i + q.length + 60); }
const Palette = {
  el: null, sel: 0, items: [],
  commands() {
    const c = [
      ...VIEWS.map(v => ({ icon: v.icon, title: `Gehe zu ${v.label}`, kw: v.label, hint: v.key, run: () => App.go(v.id) })),
      { icon: 'note', title: 'Neue Notiz', hint: 'N', kw: 'notiz anlegen erstellen', run: () => Views.notes.newNote() },
      { icon: 'checksq', title: 'Neue Aufgabe', hint: 'T', kw: 'aufgabe todo task', run: () => TaskModal.open(null) },
      { icon: 'calendar', title: 'Neuer Termin', hint: 'E', kw: 'termin event', run: () => EventModal.open({ preset: { date: App.view === 'calendar' ? dkey(Cal.date) : todayKey() } }) },
      { icon: 'sun', title: 'Daily Note von heute', kw: 'journal tagebuch', run: () => App.go('notes', { daily: todayKey() }) },
      { icon: 'repeat', title: 'Neue Routine', kw: 'routine', run: () => RoutineModal.open() },
      { icon: 'bolt', title: 'Neues Habit', kw: 'habit gewohnheit', run: () => HabitModal.open() },
      { icon: 'zap', title: 'Quick Capture', hint: 'C', kw: 'schnell erfassen', run: () => focusCapture() },
      ...Templates.all().map(t => ({ icon: 'file', title: `Notiz aus Vorlage: ${t.name}`, kw: 'vorlage template', run: async () => { const n = await Templates.create(t.id); if (n) App.go('notes', { id: n.id }); } })),
      ...S.routines.map(r => ({ icon: 'play', title: `Fokusmodus: ${r.name}`, kw: 'fokus starten routine', run: () => Focus.open(r.id) })),
      { icon: 'edit', title: 'Wochenrückblick schreiben', kw: 'review reflexion', run: () => { RevUI.mode = 'week'; RevUI.anchor = startOfDay(new Date()); App.go('review'); setTimeout(() => $('#rqGood')?.focus(), 600); } },
      { icon: 'moon', title: 'Farbschema wechseln', hint: 'L', kw: 'dark light theme dunkel hell', run: () => cycleTheme() },
      { icon: 'download', title: 'Backup exportieren', kw: 'sichern json', run: () => Backup.exportFile() },
      { icon: 'upload', title: 'Backup importieren', kw: 'wiederherstellen json', run: () => Backup.importFlow() },
      { icon: 'upload', title: 'ICS importieren', kw: 'stundenplan kalender ical', run: () => ICS.importFlow() },
      { icon: 'download', title: 'ICS exportieren', kw: 'kalender ical', run: () => ICS.exportAll() },
      { icon: 'keyboard', title: 'Tastenkürzel anzeigen', hint: '?', kw: 'hilfe shortcuts', run: () => showHelp() }
    ];
    return c;
  },
  search(q) {
    const nq = norm(q); if (!nq) return [];
    const score = (title, body = '') => { const t = norm(title); return t.startsWith(nq) ? 3 : t.includes(nq) ? 2 : norm(body).includes(nq) ? 1 : 0; };
    const res = [];
    S.notes.forEach(n => { const s = score(noteTitle(n), `${n.content} ${n.tags.join(' ')} ${n.folder}`); if (s) res.push({ s, group: 'Notizen', icon: n.type === 'daily' ? 'sun' : 'note', title: noteTitle(n), sub: snippet(n.content, q) || n.folder || '', run: () => App.go('notes', { id: n.id }) }); });
    S.tasks.forEach(t => { const s = score(t.title, t.notes + ' ' + t.project); if (s) res.push({ s, group: 'Aufgaben', icon: 'checksq', title: t.title, sub: [t.done ? 'erledigt' : t.due ? 'fällig ' + relDay(t.due) : 'offen', t.project].filter(Boolean).join(' · '), run: () => TaskModal.open(t.id) }); });
    S.events.forEach(ev => { const s = score(ev.title, `${ev.location} ${ev.notes}`); if (s) { const st = parseDT(ev.start); res.push({ s, group: 'Termine', icon: 'calendar', title: ev.title, sub: ev.rrule ? rruleText(ev.rrule) : `${fmtDateMid(st)}${ev.allDay ? '' : ', ' + fmtTime(st)}`, run: () => { const next = ev.rrule ? occurrences(ev, startOfDay(new Date()), addDays(new Date(), 400))[0] : null; App.go('calendar', { date: next ? next.date : ev.start.slice(0, 10), view: 'day' }); setTimeout(() => EventModal.open({ occ: next || { ev, start: st, end: parseDT(ev.end), date: ev.start.slice(0, 10), key: ev.id } }), 350); } }); } });
    S.routines.forEach(r => { const s = score(r.name, r.steps.map(x => x.text).join(' ')); if (s) res.push({ s, group: 'Routinen', icon: 'repeat', title: r.name, sub: `${r.steps.length} Schritte`, run: () => { RoutUI.tab = 'routines'; App.go('routines'); } }); });
    S.habits.forEach(hb => { const s = score(hb.name); if (s) res.push({ s, group: 'Habits', icon: 'bolt', title: hb.name, sub: rhythmText(hb), run: () => { RoutUI.tab = 'habits'; App.go('routines', { tab: 'habits' }); } }); });
    S.tools.forEach(t => { const s = score(t.name, t.href + ' ' + t.desc); if (s) res.push({ s, group: 'Tools', icon: 'grid', title: t.name, sub: t.href, run: () => { if (t.newTab) window.open(t.href, '_blank', 'noopener'); else location.href = t.href; } }); });
    return res.sort((a, b) => b.s - a.s).slice(0, 40);
  },
  open(initial = '') {
    if (this.el) { $('input', this.el).focus(); return; }
    closeMenu();
    this.last = document.activeElement;
    this.el = h('div', { class: 'overlay palette-wrap' }, `<div class="palette" role="dialog" aria-modal="true" aria-label="Command Palette">
      <div class="palette-input">${ico('search')}<input id="palIn" placeholder="Suchen oder Befehl eingeben …" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palList" value="${esc(initial)}"><span class="kbd">Esc</span></div>
      <div class="palette-list" id="palList" role="listbox"></div>
      <div class="palette-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> wählen</span><span><span class="kbd">↵</span> öffnen</span><span class="spacer"></span><span>Durchsucht Notizen, Aufgaben, Termine, Routinen, Habits & Tools</span></div></div>`);
    document.body.append(this.el);
    const inp = $('#palIn', this.el);
    inp.addEventListener('input', () => { this.sel = 0; this.render(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.sel = Math.min(this.items.length - 1, this.sel + 1); this.mark(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.sel = Math.max(0, this.sel - 1); this.mark(); }
      else if (e.key === 'Enter') { e.preventDefault(); this.run(this.items[this.sel]); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.close(); }
    });
    this.el.addEventListener('mousedown', e => { if (e.target === this.el) this.close(); });
    $('#palList', this.el).addEventListener('click', e => { const b = e.target.closest('[data-pi]'); if (b) this.run(this.items[+b.dataset.pi]); });
    $('#palList', this.el).addEventListener('mousemove', e => { const b = e.target.closest('[data-pi]'); if (b && +b.dataset.pi !== this.sel) { this.sel = +b.dataset.pi; this.mark(false); } });
    this.sel = 0; this.render(); setTimeout(() => inp.focus(), 20);
  },
  render() {
    const q = $('#palIn', this.el).value.trim();
    const cmds = this.commands().filter(c => !q || norm(c.title + ' ' + (c.kw || '')).includes(norm(q))).slice(0, q ? 6 : 9).map(c => ({ ...c, group: 'Befehle' }));
    let res = this.search(q);
    if (!q) res = S.notes.filter(n => n.type !== 'daily' || n.content.trim()).sort((a, b) => String(b.updated).localeCompare(String(a.updated))).slice(0, 5).map(n => ({ group: 'Zuletzt bearbeitet', icon: n.type === 'daily' ? 'sun' : 'note', title: noteTitle(n), sub: mdPlain(n.content).slice(0, 80), run: () => App.go('notes', { id: n.id }) }));
    this.items = q ? [...res, ...cmds] : [...cmds, ...res];
    if (q && !res.length) this.items.push({ group: 'Anlegen', icon: 'plus', title: `„${q}“ als Aufgabe anlegen`, run: () => { const t = Tasks.make({ title: q }); Data.upsert('tasks', t); App.refresh(); toast('Aufgabe angelegt'); } }, { group: 'Anlegen', icon: 'note', title: `Notiz „${q}“ anlegen`, run: () => Views.notes.newNote({ title: q }) });
    let html = '', g = '';
    this.items.forEach((it, i) => {
      if (it.group !== g) { g = it.group; html += `<div class="pal-group">${esc(g)}</div>`; }
      html += `<button class="pal-item ${i === this.sel ? 'on' : ''}" data-pi="${i}" role="option" aria-selected="${i === this.sel}"><span class="pi">${ico(it.icon, 'sm')}</span><span class="pt"><div>${hl(it.title, q)}</div>${it.sub ? `<small>${hl(it.sub, q)}</small>` : ''}</span>${it.hint ? `<span class="kbd">${it.hint}</span>` : ''}</button>`;
    });
    $('#palList', this.el).innerHTML = html || empty('search', 'Nichts gefunden', 'Probier einen anderen Begriff.');
  },

const isTyping = el => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
document.addEventListener('keydown', e => {
  if (Focus.el) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && k.toLowerCase() === 'k') { e.preventDefault(); Palette.el ? Palette.close() : Palette.open(); return; }
  if (mod && k.toLowerCase() === 's') { e.preventDefault(); Views.notes.saveNow && Views.notes.saveNow(); toast('Alles gespeichert ✓'); return; }
  if (k === 'Escape') {
    if (Palette.el) { Palette.close(); return; }
    if (openMenuEl) { closeMenu(); return; }
    const top = Modals[Modals.length - 1]; if (top && top.dismissable) { e.preventDefault(); top.close(); return; }
    if (isTyping(e.target)) e.target.blur();
    return;
  }
  if (k === 'Tab' && (Modals.length || Palette.el)) { // Fokus im Dialog halten
    const box = Palette.el || Modals[Modals.length - 1].el;
    const f = $$('button:not([disabled]), input:not([type=hidden]), textarea, select, a[href], [tabindex]:not([tabindex="-1"])', box).filter(x => x.offsetParent !== null);
    if (!f.length) return; const i = f.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } else if (i < 0) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (isTyping(e.target) || mod || e.altKey || Modals.length || Palette.el) return;
  const lk = k.toLowerCase();
  if (App.view === 'calendar') {
    if (k === 'ArrowLeft') { e.preventDefault(); calShift(-1); return; }
    if (k === 'ArrowRight') { e.preventDefault(); calShift(1); return; }
    if (lk === 'h') { calToday(); return; }
    const mv = { m: 'month', w: 'week', d: 'day', a: 'agenda' }[lk]; if (mv) { calSetView(mv); return; }
  }
  if (lk === 'n') { e.preventDefault(); Views.notes.newNote(); }
  else if (lk === 't') { e.preventDefault(); TaskModal.open(null, { today: App.view === 'tasks' && TaskUI.area === 'today' ? todayKey() : null }); }
  else if (lk === 'e') { e.preventDefault(); EventModal.open({ preset: { date: App.view === 'calendar' ? dkey(Cal.date) : todayKey() } }); }
  else if (lk === 'c') { e.preventDefault(); focusCapture(); }
  else if (k === '/') { e.preventDefault(); Palette.open(); }
  else if (k === '?') { e.preventDefault(); showHelp(); }
  else if (lk === 'l') cycleTheme();
  else if (/^[1-8]$/.test(k)) App.go(VIEWS[+k - 1].id);
});

/* ============ 12. BACKUP, AUTO-BACKUP, ICS ============ */
const Backup = {
  async collect() {
    return {
      app: 'daniels-planer', schema: SCHEMA_VERSION, exportedAt: nowISO(),
      settings: { ...Settings.data },
      data: {
        events: S.events, notes: S.notes, tasks: S.tasks, routines: S.routines, habits: S.habits, tools: S.tools,
        days: Object.values(S.days), images: [...S.images.values()],
        meta: [S.meta.categories, S.meta.templates, S.meta.schema, S.meta.toolsSeeded].filter(Boolean)
      }
    };
  },
  async exportFile() {
    try {
      Views.notes.saveNow && Views.notes.saveNow();
      const data = JSON.stringify(await this.collect());
      download(`daniels-planer-backup-${todayKey()}.json`, data);
      Settings.set('lastBackup', nowISO()); $('#backupBanner')?.remove();
      toast(`Backup exportiert (${(data.length / 1048576).toFixed(2)} MB)`);
    } catch (e) { console.error(e); toast('Export fehlgeschlagen'); }
  },
  migrate(obj) {
    if (!obj.schema) obj.schema = 1;
    // künftige Backup-Migrationen: if (obj.schema < 2) { … obj.schema = 2; }
    return obj;
  },
  async importFlow() {
    const f = await pickFile('application/json,.json'); if (!f) return;
    let obj;
    try { obj = JSON.parse(await readText(f)); } catch (e) { toast('Datei ist kein gültiges JSON'); return; }
    if (!obj || obj.app !== 'daniels-planer' || !obj.data) { toast('Das ist kein Backup von Daniels Planer'); return; }
    if (obj.schema > SCHEMA_VERSION) { toast('Backup stammt aus einer neueren Version'); return; }
    const d = obj.data;
    const ok = await confirmDialog({ title: 'Backup importieren?', text: `Vom ${obj.exportedAt ? fmtDateMid(new Date(obj.exportedAt)) : '?'}: ${(d.events || []).length} Termine, ${(d.notes || []).length} Notizen, ${(d.tasks || []).length} Aufgaben, ${(d.images || []).length} Bilder.<br><br><strong>Alle aktuellen Daten werden ersetzt.</strong>`, ok: 'Importieren & ersetzen', danger: true });
    if (!ok) return;
    await this.restore(this.migrate(obj));
  },
  async restore(obj) {
    try {
      const d = obj.data;
      for (const s of STORES) { if (s === 'meta') continue; await DB.clear(s); }
      for (const s of LIST_STORES) await DB.putMany(s, d[s] || []);
      await DB.putMany('days', d.days || []); await DB.putMany('images', d.images || []);
      for (const m of d.meta || []) if (m && m.id && m.id !== 'backupDir') await DB.put('meta', m);
      if (obj.settings) { const keep = { installedAt: Settings.data.installedAt }; Object.assign(Settings.data, obj.settings, keep, { onboarded: true, lastBackup: nowISO() }); Settings.save(); }
      await Data.loadAll(); applyTheme();
      App.view = null; App.go('today'); MiniCal.render();
      toast('Backup wiederhergestellt 🌿');
    } catch (e) { console.error(e); toast('Import fehlgeschlagen: ' + e.message); }
  },
  async resetFlow() {
    openModal({
      title: 'Wirklich alles löschen?',
      body: `<p class="muted">Das kann nicht rückgängig gemacht werden. Tippe <strong>LÖSCHEN</strong> zur Bestätigung.</p><input class="input" id="rsIn" autocomplete="off" aria-label="Bestätigung">`,
      foot: `<button class="btn" data-a="exp">${ico('download', 'sm')} Vorher Backup</button><span class="spacer"></span><button class="btn" data-close>Abbrechen</button><button class="btn danger solid" data-a="go" disabled>Endgültig löschen</button>`,
      onMount: (m, api) => {
        $('#rsIn', m).addEventListener('input', e => { $('[data-a="go"]', m).disabled = e.target.value.trim().toUpperCase() !== 'LÖSCHEN'; });
        $('[data-a="exp"]', m).addEventListener('click', () => this.exportFile());
        $('[data-a="go"]', m).addEventListener('click', async () => {
          for (const s of STORES) { try { await DB.clear(s); } catch (e) { /* weiter */ } }
          try { Object.keys(localStorage).filter(k => k.startsWith('danielsPlaner')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* egal */ }
          api.close(); location.hash = ''; location.reload();
        });
      }
    });
  },
  due() {
    const days = +Settings.data.backupRemindDays; if (!days) return false;
    if (Settings.data.backupSnooze === todayKey()) return false;
    const has = S.notes.length + S.events.length + S.tasks.length + S.routines.length + S.habits.length > 0; if (!has) return false;
    const last = new Date(Settings.data.lastBackup || Settings.data.installedAt);

  },

    return `<div class="banner" id="backupBanner" role="status">${ico('database')}<span style="flex:1">${last == null ? 'Du hast noch kein Backup erstellt.' : `Dein letztes Backup ist ${last} Tage her.`} Sichere deine Daten mit einem Klick.</span><button class="btn sm primary" data-backup="export">Jetzt sichern</button><button class="btn sm ghost" data-backup="snooze">Später</button></div>`;
  }
};
document.addEventListener('click', e => {

/* Optional (Chrome/Edge): automatisches Backup in einen gewählten Ordner – File System Access API */
const AutoBackup = {
  handle: null, needsPerm: false, supported: 'showDirectoryPicker' in window,
  async init() { const rec = S.meta.backupDir; if (rec && rec.handle && typeof rec.handle.getFileHandle === 'function') this.handle = rec.handle; },
  statusText() {
    if (!this.supported) return 'Wird von diesem Browser nicht unterstützt';
    if (!this.handle) return 'Nicht eingerichtet – sichert nach Änderungen automatisch';
    return `Ordner „${esc(this.handle.name)}“${Settings.data.lastAutoBackup ? ` · zuletzt ${fmtDateMid(new Date(Settings.data.lastAutoBackup))}, ${fmtTime(new Date(Settings.data.lastAutoBackup))}` : ''}${this.needsPerm ? ' · Zugriff erneut bestätigen („Jetzt sichern“)' : ''}`;
  },
  async choose() {
    try {
      const hd = await window.showDirectoryPicker({ id: 'daniels-planer-backup', mode: 'readwrite' });
      this.handle = hd; S.meta.backupDir = { id: 'backupDir', handle: hd };
      try { await DB.put('meta', S.meta.backupDir); } catch (e) { toast('Ordner kann nicht dauerhaft gemerkt werden'); }
      await this.write(true, true); App.refresh();
    } catch (e) { if (e.name !== 'AbortError') toast('Ordner konnte nicht gewählt werden'); }
  },
  async disconnect() { this.handle = null; delete S.meta.backupDir; try { await DB.del('meta', 'backupDir'); } catch (e) { /* egal */ } App.refresh(); toast('Auto-Backup getrennt'); },
  async perm(ask) {
    const o = { mode: 'readwrite' };
    if (!this.handle.queryPermission) return true;
    if ((await this.handle.queryPermission(o)) === 'granted') return true;
    if (ask && (await this.handle.requestPermission(o)) === 'granted') return true;
    return false;
  },
  schedule: debounce(() => AutoBackup.write(false), 15000),
  async write(ask, verbose) {
    if (!this.handle) return;
    try {
      if (!(await this.perm(ask))) { this.needsPerm = true; return; }
      this.needsPerm = false;
      const data = JSON.stringify(await Backup.collect());

        const fh = await this.handle.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close();
      }
      Settings.set('lastAutoBackup', nowISO()); Settings.set('lastBackup', nowISO());
      if (verbose) toast('Auto-Backup geschrieben');
      const s = $('#sAuto'); if (s) s.innerHTML = this.statusText();
    } catch (e) { console.warn('Auto-Backup fehlgeschlagen', e); if (verbose) toast('Auto-Backup fehlgeschlagen'); }
  }
};

/* ICS Import & Export (RFC 5545, gängige Teilmenge) */
const ICS_DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
const ICS = {
  esc: s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'),
  unesc: s => String(s || '').replace(/\\n/gi, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\'),
  fold(line) { const out = []; let l = line; while (l.length > 73) { out.push(l.slice(0, 73)); l = ' ' + l.slice(73); } out.push(l); return out.join('\r\n'); },
  fmt(d, allDay) { const b = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; return allDay ? b : `${b}T${pad(d.getHours())}${pad(d.getMinutes())}00`; },
  exportAll() {
    download(`daniels-planer-${todayKey()}.ics`, this.build(), 'text/calendar');
    toast(`${S.events.length} Termine als .ics exportiert`);
  },
  build() {
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Daniels Planer//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Daniels Planer'];
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    S.events.forEach(ev => {
      const s = parseDT(ev.start), e = parseDT(ev.end);
      L.push('BEGIN:VEVENT', `UID:${ev.uid || ev.id + '@daniels-planer'}`, `DTSTAMP:${stamp}`);
      if (ev.allDay) { L.push(`DTSTART;VALUE=DATE:${this.fmt(s, true)}`, `DTEND;VALUE=DATE:${this.fmt(addDays(startOfDay(e), 1), true)}`); }
      else L.push(`DTSTART:${this.fmt(s)}`, `DTEND:${this.fmt(e)}`);
      L.push(`SUMMARY:${this.esc(ev.title)}`);
      if (ev.location) L.push(`LOCATION:${this.esc(ev.location)}`);
      if (ev.notes) L.push(`DESCRIPTION:${this.esc(ev.notes)}`);
      if (ev.cat) L.push(`CATEGORIES:${this.esc(cat(ev.cat).name)}`);
      if (ev.rrule) {
        const r = ev.rrule; let rr = `RRULE:FREQ=${r.freq.toUpperCase()}`;
        if (r.interval > 1) rr += `;INTERVAL=${r.interval}`;
        if (r.freq === 'weekly' && r.byDay && r.byDay.length) rr += `;BYDAY=${r.byDay.map(d => ICS_DAYS[d]).join(',')}`;
        if (r.until) rr += `;UNTIL=${r.until.replace(/-/g, '')}T235959`;
        L.push(rr);
        (ev.exdates || []).forEach(k => { const x = parseKey(k); if (!ev.allDay) x.setHours(s.getHours(), s.getMinutes()); L.push(ev.allDay ? `EXDATE;VALUE=DATE:${this.fmt(x, true)}` : `EXDATE:${this.fmt(x)}`); });
      }
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(l => this.fold(l)).join('\r\n');
  },
  pdate(v, P = {}) {
    v = String(v).trim();
    const y = +v.slice(0, 4), mo = +v.slice(4, 6) - 1, d = +v.slice(6, 8);
    if (P.VALUE === 'DATE' || /^\d{8}$/.test(v)) return { date: new Date(y, mo, d), allDay: true };
    const hh = +v.slice(9, 11) || 0, mi = +v.slice(11, 13) || 0, ss = +v.slice(13, 15) || 0;
    // UTC (…Z) wird in Ortszeit umgerechnet; TZID wird als Ortszeit interpretiert
    return { date: /Z$/.test(v) ? new Date(Date.UTC(y, mo, d, hh, mi, ss)) : new Date(y, mo, d, hh, mi, ss), allDay: false };
  },
  pdur(v) { const m = String(v).match(/P(?:(\d+)W)?(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?/); if (!m) return 60; return (+m[1] || 0) * 10080 + (+m[2] || 0) * 1440 + (+m[3] || 0) * 60 + (+m[4] || 0); },
  parse(text) {
    const lines = String(text).replace(/\r?\n[ \t]/g, '').split(/\r?\n/);
    const raw = []; let cur = null, depth = 0;
    for (const line of lines) {
      if (/^BEGIN:VEVENT/i.test(line)) { cur = {}; depth = 0; continue; }
      if (/^END:VEVENT/i.test(line)) { if (cur) raw.push(cur); cur = null; continue; }
      if (!cur) continue;
      if (/^BEGIN:/i.test(line)) { depth++; continue; } if (/^END:/i.test(line)) { depth--; continue; } if (depth > 0) continue; // VALARM etc.
      const i = line.indexOf(':'); if (i < 0) continue;
      const left = line.slice(0, i), val = line.slice(i + 1); const [name, ...params] = left.split(';');
      const P = {}; params.forEach(p => { const [k, v] = p.split('='); if (k) P[k.toUpperCase()] = (v || '').replace(/"/g, ''); });
      const N = name.toUpperCase();
      if (N === 'EXDATE') (cur.EXDATE = cur.EXDATE || []).push(...val.split(',').map(v => ({ v, P })));
      else cur[N] = { v: val, P };
    }
    const out = [];
    raw.forEach(r => {
      if (!r.DTSTART) return;
      const s = this.pdate(r.DTSTART.v, r.DTSTART.P); let e;
      if (r.DTEND) e = this.pdate(r.DTEND.v, r.DTEND.P).date;
      else if (r.DURATION) e = addMinutes(s.date, this.pdur(r.DURATION.v));
      else e = s.allDay ? addDays(s.date, 1) : addMinutes(s.date, 60);
      if (s.allDay) e = addMinutes(startOfDay(e), -1); if (e <= s.date) e = s.allDay ? addMinutes(s.date, 1439) : addMinutes(s.date, 60);
      const ev = { id: uid('e_'), uid: r.UID?.v || '', title: this.unesc(r.SUMMARY?.v || 'Termin'), start: toDT(s.date), end: toDT(e), allDay: s.allDay, location: this.unesc(r.LOCATION?.v || ''), notes: this.unesc(r.DESCRIPTION?.v || ''), cat: '', noteId: '', rrule: null, exdates: [] };
      if (r.RRULE) {
        const R = {}; r.RRULE.v.split(';').forEach(p => { const [k, v] = p.split('='); R[k.toUpperCase()] = v; });
        const freq = (R.FREQ || '').toLowerCase();
        if (['daily', 'weekly', 'monthly', 'yearly'].includes(freq)) {
          ev.rrule = { freq, interval: +R.INTERVAL || 1, byDay: freq === 'weekly' && R.BYDAY ? R.BYDAY.split(',').map(x => ICS_DAYS.indexOf(x.replace(/[^A-Z]/g, ''))).filter(x => x >= 0) : [], until: null };
          if (R.UNTIL) ev.rrule.until = dkey(this.pdate(R.UNTIL).date);
          else if (R.COUNT) { const occ = occurrences(ev, s.date, addDays(s.date, 1200)); const c = Math.min(+R.COUNT, occ.length); if (c) ev.rrule.until = occ[c - 1].date; }
        }
      }
      (r.EXDATE || []).forEach(x => ev.exdates.push(dkey(this.pdate(x.v, x.P).date)));
      out.push(ev);
    });
    return out;
  },
  /* übernimmt geparste Termine; gleiche UID (auch eigene Exporte) → aktualisieren statt duplizieren */
  apply(list, c, upd) {
    let added = 0, updated = 0; const ids = [];
    list.forEach(ev => {
      const ex = ev.uid && S.events.find(x => x.uid === ev.uid || `${x.id}@daniels-planer` === ev.uid);
      if (ex) { if (upd) { Object.assign(ex, { ...ev, id: ex.id, uid: ex.uid || ev.uid, noteId: ex.noteId, taskId: ex.taskId, cat: c || ex.cat }); Data.upsert('events', ex); updated++; } }
      else { ev.cat = c; Data.upsert('events', ev); ids.push(ev.id); added++; }
    });
    return { added, updated, ids };
  },
  async importFlow() {
    const f = await pickFile('.ics,text/calendar'); if (!f) return;
    let list;
    try { list = this.parse(await readText(f)); } catch (e) { console.error(e); toast('Die Datei konnte nicht gelesen werden'); return; }
    if (!list.length) { toast('Keine Termine in der Datei gefunden'); return; }
    const series = list.filter(x => x.rrule).length;
    openModal({
      title: 'Kalender importieren',
      body: `<p class="muted"><strong>${list.length}</strong> Termine gefunden${series ? `, davon ${series} Serien` : ''} in „${esc(f.name)}“.</p>
        <div class="field"><span class="label">Kategorie für importierte Termine</span>${catChips(/stunden|uni|vorles/i.test(f.name) ? 'uni' : '', 'icat')}</div>
        <div class="row"><label class="switch"><input type="checkbox" id="icUpd" checked><span></span></label><label for="icUpd">Bereits importierte Termine (gleiche UID) aktualisieren</label></div>`,
      foot: `<span class="spacer"></span><button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>Importieren</button>`,
      onMount: (m, api) => {
        bindChips(m, 'icat');
        $('[data-ok]', m).addEventListener('click', () => {
          const { added, updated, ids } = this.apply(list, chipValue(m, 'icat'), $('#icUpd', m).checked);
          api.close(); App.refresh();
          toast(`${added} Termine importiert${updated ? `, ${updated} aktualisiert` : ''}`, { undo: () => { ids.forEach(id => Data.remove('events', id)); App.refresh(); } });
        });
      }
    });
  }
};

const Onboarding = {
  open() {
    const st = { step: 0, name: Settings.data.name || 'Daniel', cats: clone(cats().length ? cats() : DEFAULT_CATS).map(c => ({ ...c, on: true })), routine: S.routines.length ? 'none' : 'morning', demo: !S.events.length && !S.notes.length, theme: Settings.data.theme };
    const N = 4;
    const pane = () => {
      if (st.step === 0) return `<div class="onb-pane"><div style="font-size:44px" aria-hidden="true">🌿</div><div class="onb-hello">Willkommen in deinem Planer.</div>
        <p class="muted">Termine, Routinen, Notizen und Aufgaben – an einem ruhigen Ort. Alles bleibt lokal auf diesem Gerät und funktioniert offline.</p>
        <div class="field"><label for="obName">Wie dürfen wir dich nennen?</label><input class="input" id="obName" value="${esc(st.name)}" autofocus></div></div>`;
      if (st.step === 1) return `<div class="onb-pane"><div class="onb-hello" style="font-size:28px">Deine Lebensbereiche</div><p class="muted">Kategorien färben Termine, Aufgaben und Habits. Du kannst sie jederzeit ändern.</p>
        <div id="obCats">${st.cats.map((c, i) => `<div class="cat-row" data-ci="${i}"><label class="switch"><input type="checkbox" data-cf="on" ${c.on ? 'checked' : ''} aria-label="${esc(c.name)} verwenden"><span></span></label><input type="color" data-cf="color" value="${c.color}" aria-label="Farbe"><input class="input" data-cf="name" value="${esc(c.name)}" aria-label="Name"></div>`).join('')}</div>
        <button type="button" class="btn sm" data-o="addcat" style="width:fit-content">${ico('plus', 'sm')} Eigene Kategorie</button></div>`;
      if (st.step === 2) return `<div class="onb-pane"><div class="onb-hello" style="font-size:28px">Deine erste Routine</div><p class="muted">Routinen erscheinen automatisch unter „Heute“ – passend zur Tageszeit. Im Fokusmodus spielst du sie Schritt für Schritt ab.</p>
        <div class="stack">${Object.entries(ROUTINE_PRESETS).map(([k, p]) => `<button type="button" class="preset ${st.routine === k ? 'on' : ''}" data-rp="${k}"><span class="emo" aria-hidden="true">${p.emoji}</span><span><strong>${p.name}</strong><br><span class="small faint">${p.steps.map(s => s[0]).join(' · ')}</span></span></button>`).join('')}
        <button type="button" class="preset ${st.routine === 'none' ? 'on' : ''}" data-rp="none"><span class="emo" aria-hidden="true">✋</span><span><strong>Später</strong><br><span class="small faint">Ich lege selbst eine an</span></span></button></div></div>`;
      return `<div class="onb-pane"><div class="onb-hello" style="font-size:28px">Fast geschafft, ${esc(st.name)}!</div>
        <div class="set-row"><div class="txt"><strong>Farbschema</strong><span>Hell, dunkel oder wie dein System</span></div>${seg('obtheme', [['system', 'System'], ['light', 'Hell'], ['dark', 'Dunkel']], st.theme, 'Farbschema')}</div>
        <div class="set-row"><div class="txt"><strong>Demodaten laden</strong><span>Beispiel-Stundenplan, Habits mit Verlauf, Notizen – ideal zum Ausprobieren</span></div><label class="switch"><input type="checkbox" id="obDemo" ${st.demo ? 'checked' : ''}><span></span></label></div>
        <p class="small faint">Tipp: <span class="kbd">Strg</span> <span class="kbd">K</span> öffnet die Command Palette, <span class="kbd">?</span> zeigt alle Tastenkürzel. Denk an regelmäßige Backups (Einstellungen → Daten & Backup).</p></div>`;
    };
    openModal({
      label: 'Einrichtung', cls: 'onb', dismissable: false,
      body: `<div class="onb-steps" aria-hidden="true">${Array.from({ length: N }, (_, i) => `<i class="${i <= st.step ? 'on' : ''}"></i>`).join('')}</div><div id="obPane"></div>`,
      foot: `<button class="btn ghost" data-o="back">Zurück</button><span class="spacer"></span><button class="btn ghost" data-o="skip">Überspringen</button><button class="btn primary" data-o="next">Weiter</button>`,
      onMount: (m, api) => {
        const sync = () => {
          if ($('#obName', m)) st.name = $('#obName', m).value.trim() || 'Daniel';
          $$('#obCats [data-ci]', m).forEach(row => { const c = st.cats[+row.dataset.ci]; c.on = $('[data-cf="on"]', row).checked; c.color = $('[data-cf="color"]', row).value; c.name = $('[data-cf="name"]', row).value.trim() || c.name; });
          if ($('#obDemo', m)) st.demo = $('#obDemo', m).checked;
          const th = segValue(m, 'obtheme'); if (th) st.theme = th;
        };
        const draw = () => {
          $('#obPane', m).innerHTML = pane(); initSegs(m);
          $$('.onb-steps i', m).forEach((x, i) => x.classList.toggle('on', i <= st.step));
          $('[data-o="back"]', m).style.visibility = st.step ? '' : 'hidden';
          $('[data-o="skip"]', m).style.display = st.step === N - 1 ? 'none' : '';
          $('[data-o="next"]', m).textContent = st.step === N - 1 ? 'Los geht’s' : 'Weiter';
          setTimeout(() => ($('input:not([type=checkbox]):not([type=color])', $('#obPane', m)) || $('[data-o="next"]', m)).focus(), 60);
          const ts = $('.seg[data-seg="obtheme"]', m); if (ts) ts.addEventListener('click', () => setTimeout(() => { sync(); Settings.data.theme = st.theme; applyTheme(); }));
        };
        draw();
        m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'obName') { e.preventDefault(); $('[data-o="next"]', m).click(); } });
        m.addEventListener('click', async e => {
          const rp = e.target.closest('[data-rp]'); if (rp) { st.routine = rp.dataset.rp; $$('[data-rp]', m).forEach(b => b.classList.toggle('on', b === rp)); return; }
          const b = e.target.closest('[data-o]'); if (!b) return; sync();
          if (b.dataset.o === 'addcat') { st.cats.push({ id: uid('c_'), name: 'Neue Kategorie', color: '#6d8fb3', on: true }); draw(); return; }
          if (b.dataset.o === 'back') { st.step = Math.max(0, st.step - 1); draw(); return; }
          if (b.dataset.o === 'skip' || (b.dataset.o === 'next' && st.step === N - 1)) {
            if (b.dataset.o === 'skip') { st.demo = false; }
            Settings.data.name = st.name; Settings.data.theme = st.theme; Settings.data.onboarded = true; Settings.save(); applyTheme();
            const chosen = st.cats.filter(c => c.on).map(({ on, ...c }) => c);
            S.meta.categories.items = chosen.length ? chosen : clone(DEFAULT_CATS); await Data.saveMeta('categories');
            if (b.dataset.o !== 'skip' && st.routine !== 'none' && !S.routines.some(r => r.name === ROUTINE_PRESETS[st.routine].name)) await Data.upsert('routines', makeRoutine(st.routine));
            if (st.demo) await Demo.load();
            api.close(); App.view = null; App.go('today'); MiniCal.render();
            setTimeout(() => { confetti(innerWidth / 2, innerHeight / 3, 160); toast(`Schön, dass du da bist, ${st.name}!`); }, 350);
            return;
          }
          st.step++; draw();
        });
      }
    });
  }
};

const Demo = {
  async load() {
    const today = startOfDay(new Date()), ws = startOfWeek(today), dk = n => dkey(addDays(today, n));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const at = (d, hm) => { const [hh, mm] = hm.split(':').map(Number); const x = new Date(d); x.setHours(hh, mm, 0, 0); return toDT(x); };
    const firstOn = wd => addDays(addDays(ws, -21), (wd + 6) % 7);
    const ev = (title, d, s, e, c, extra = {}) => ({ id: uid('e_'), title, start: at(d, s), end: at(d, e), allDay: false, location: '', cat: c, notes: '', noteId: '', rrule: null, exdates: [], ...extra });
    const allday = (title, d, c) => ({ id: uid('e_'), title, start: at(d, '00:00'), end: at(d, '23:59'), allDay: true, location: '', cat: c, notes: '', noteId: '', rrule: null, exdates: [] });
    const weekly = days => ({ freq: 'weekly', interval: 1, byDay: days, until: null });
    const stat = ev('Vorlesung Statistik', firstOn(1), '10:00', '11:30', 'uni', { location: 'Hörsaal 2', rrule: weekly([1]) });
    const events = [
      stat,
      ev('Seminar Sozialpädagogik', firstOn(3), '14:00', '15:30', 'uni', { location: 'Raum B 104', rrule: weekly([3]) }),
      ev('Übung Forschungsmethoden', firstOn(4), '08:30', '10:00', 'uni', { location: 'PC-Pool', rrule: weekly([4]) }),
      ev('Dienst Don Bosco', firstOn(2), '15:00', '19:00', 'arbeit', { location: 'Don Bosco Jugendhaus', rrule: weekly([2, 5]) }),
      ev('Gym', firstOn(1), '18:30', '19:45', 'training', { location: 'Studio', rrule: weekly([1, 3, 5]) }),
      ev('Laufen am Fluss', firstOn(0), '10:00', '11:00', 'training', { rrule: weekly([0]) }),
      ev('Kaffee mit Lea', today, '16:30', '17:30', 'privat', { location: 'Café am Markt' }),
      ev('Zahnarzt', addDays(today, 3), '09:00', '09:45', 'privat', { location: 'Praxis Dr. Berger' }),
      ev('Teamsitzung Don Bosco', addDays(today, 8), '18:00', '19:30', 'arbeit', { rrule: { freq: 'monthly', interval: 1, byDay: [], until: null } }),
      allday('Geburtstag Mama 🎂', addDays(today, 5), 'privat'),
      allday('Abgabe Hausarbeit', addDays(today, 12), 'uni')
    ];
    const routines = ['morning', 'evening', 'training'].filter(k => !S.routines.some(r => r.name === ROUTINE_PRESETS[k].name)).map(makeRoutine);
    const allR = [...S.routines, ...routines];
    const mkHabit = (name, emoji, freq, c, p) => {
      const hb = { id: uid('h_'), name, emoji, freq, cat: c, log: {}, created: addDays(today, -200).toISOString() };
      for (let i = 200; i >= 1; i--) { const d = addDays(today, -i); if (habitScheduled(hb, d) && Math.random() < (i < 12 ? .96 : p)) hb.log[dkey(d)] = 1; }
      return hb;
    };
    const habits = [
      mkHabit('2 Liter Wasser', '💧', { type: 'daily' }, 'privat', .8),
      mkHabit('20 Minuten lesen', '📚', { type: 'daily' }, 'uni', .65),
      mkHabit('Sport', '💪', { type: 'weekly', times: 3, days: [1, 3, 5] }, 'training', .45),
      mkHabit('Meditation', '🧘', { type: 'days', days: [1, 2, 3, 4, 5], times: 5 }, 'privat', .7),
      mkHabit('Kein Handy nach 22 Uhr', '📵', { type: 'daily' }, 'privat', .5)
    ];
    const days = [];
    let mood = 3.5, energy = 3.2;
    for (let i = 42; i >= 0; i--) {
      const d = addDays(today, -i), k = dkey(d), rec = { ...Data.day(k) };
      rec.routines = { ...(rec.routines || {}) };
      if (i > 0) {
        mood = clamp(mood + rnd(-.8, .8), 1.6, 5); energy = clamp(energy + rnd(-.9, .9), 1.4, 5);
        rec.mood = Math.round(mood); rec.energy = Math.round(energy);
        allR.forEach(r => { if (r.days && r.days.length && !r.days.includes(d.getDay())) return; const q = Math.random(); rec.routines[r.id] = q < .7 ? r.steps.map(s => s.id) : q < .9 ? r.steps.slice(0, Math.ceil(r.steps.length / 2)).map(s => s.id) : []; });
      } else {
        rec.prio = [{ text: 'Hausarbeit: Gliederung fertig', done: false }, { text: 'Statistik-Übung 3 rechnen', done: false }, { text: '30 Min. spazieren', done: true }];
        const m = allR.find(r => r.tod === 'morning'); if (m) rec.routines[m.id] = m.steps.slice(0, 2).map(s => s.id);
      }
      rec.updated = nowISO(); days.push(rec);
    }
    const T = (o) => ({ ...Tasks.make(o), ...o });
    const doneTitles = ['Folien Statistik nacharbeiten', 'E-Mail an Prof. Wagner', 'Wäsche', 'Dienstplan eintragen', 'Bibliotheksbücher verlängern', 'Rechnung überweisen', 'Protokoll Seminar', 'Einkaufen', 'Fahrrad reparieren', 'Übungsblatt 2 abgeben', 'Geschenk für Mama bestellen', 'Zimmer aufräumen', 'Kapitel 3 lesen', 'Bewerbung überarbeiten'];
    const tasks = [
      T({ title: 'Hausarbeit gliedern', due: dk(2), prio: 3, cat: 'uni', project: 'Hausarbeit Pädagogik', subtasks: [{ id: uid('st_'), title: 'Forschungsfrage schärfen', done: true }, { id: uid('st_'), title: 'Kapitelstruktur', done: false }, { id: uid('st_'), title: 'Mit Betreuerin abstimmen', done: false }] }),
      T({ title: 'Literatur recherchieren', due: dk(5), prio: 2, cat: 'uni', project: 'Hausarbeit Pädagogik' }),
      T({ title: 'Einleitung schreiben', due: dk(9), prio: 1, cat: 'uni', project: 'Hausarbeit Pädagogik' }),
      T({ title: 'Wochenplanung Don Bosco vorbereiten', today: dk(0), prio: 2, cat: 'arbeit' }),
      T({ title: 'Einkaufen: Haferflocken, Obst, Quark', due: dk(0), cat: 'privat' }),
      T({ title: 'Statistik Übungsblatt 3', due: dk(-1), prio: 3, cat: 'uni' }),
      T({ title: 'Physio-Übungen machen', due: dk(1), cat: 'training' }),
      T({ title: 'Bewerbung Praktikum abschicken', due: dk(7), prio: 2, cat: 'privat' }),
      T({ title: 'Stundenplan fürs nächste Semester checken', cat: 'uni' }),
      T({ title: 'Idee: Ausflug mit der Jugendgruppe planen', cat: 'arbeit' }),
      ...doneTitles.map((title, i) => { const t = T({ title, cat: ['uni', 'privat', 'arbeit'][i % 3] }); t.done = true; const d = addDays(today, -Math.floor(i * 13 / doneTitles.length)); d.setHours(9 + (i * 3) % 10, 15); t.doneAt = d.toISOString(); return t; })
    ];
    const welcome = { id: uid('n_'), type: 'note', title: 'Willkommen in Daniels Planer', folder: 'Start', tags: ['anleitung'], pinned: true, content: `# Willkommen 🌿\nDas ist dein persönliches Life Dashboard. Ein paar Dinge zum Ausprobieren:\n\n## Schnell & mit Tastatur\n- **Strg/⌘ + K** öffnet die Command Palette – suchen, springen, anlegen\n- **N** neue Notiz · **T** neue Aufgabe · **E** neuer Termin · **?** alle Kürzel\n- Quick Capture unter „Heute“ versteht z. B. *„Lernen morgen 14–16 Uhr #uni“*\n\n## Markdown\n- **fett**, *kursiv*, \`Code\`, ==markiert==\n- [x] Checkboxen sind in der Vorschau klickbar\n- [ ] Probier’s aus!\n- Verlinke Notizen mit [[Statistik – Regression]] und Tage mit @${todayKey()}\n\n> Kleine Schritte, jeden Tag.\n\n## Daten\nAlles liegt lokal in deinem Browser (IndexedDB). Exportiere regelmäßig ein Backup unter *Einstellungen → Daten & Backup*.` };
    const lecture = { id: uid('n_'), type: 'note', title: 'Statistik – Regression', folder: 'Uni', tags: ['statistik', 'vorlesung'], pinned: false, date: dk(-1), content: `# Statistik – Regression\n**Datum:** ${fmtDateLong(addDays(today, -1))}\n\n## Kernideen\n- Lineare Regression: $y = a + b·x$\n- **Bestimmtheitsmaß R²** misst den Anteil erklärter Varianz\n- Residuen sollten *zufällig* streuen\n\n## Offene Fragen\n- [ ] Unterschied zwischen R² und korrigiertem R²?\n- [x] Formel für den Steigungskoeffizienten\n\n## Nacharbeiten\n- [ ] Übungsblatt 3\n- [ ] Kapitel 7 im Skript\n\nSiehe auch [[Willkommen in Daniels Planer]].` };
    stat.noteId = lecture.id;
    const ideas = { id: uid('n_'), type: 'note', title: 'Ideen & Gedanken', folder: 'Privat', tags: ['ideen'], pinned: false, content: '# Ideen\n- Wochenende am See mit Freunden\n- Podcast über Pädagogik starten?\n- [ ] Rezept für Meal-Prep sammeln\n- [ ] Neue Laufroute ausprobieren\n' };
    const dy = { id: dailyId(dk(-1)), type: 'daily', date: dk(-1), title: fmtDateLong(addDays(today, -1)), folder: 'Daily Notes', tags: [], pinned: false, content: '## Dankbar für\n1. Sonne am Nachmittag\n2. Gutes Gespräch mit Jonas\n\n## Heute gelernt\nRegression ist gar nicht so schlimm, wenn man es aufmalt.\n' };
    const notes = [welcome, lecture, ideas, dy].filter(n => !S.notes.some(x => x.title === n.title && n.type !== 'daily') && !Data.get('notes', n.id));
    const stamp = x => { x.created = x.created || nowISO(); x.updated = x.updated || nowISO(); return x; };
    const put = async (store, list) => { list.forEach(stamp); S[store].push(...list); await DB.putMany(store, list); };
    SaveState.begin();
    try {
      await put('events', events); await put('routines', routines); await put('habits', habits); await put('tasks', tasks); await put('notes', notes);
      days.forEach(d => { S.days[d.id] = d; }); await DB.putMany('days', days);
      SaveState.end(true);
    } catch (e) { console.error(e); SaveState.end(false); toast('Demodaten konnten nicht vollständig gespeichert werden'); }
  }
};

/* ============ 14. START ============ */
function tick() {
  const now = new Date(), k = dkey(now);
  if (App.lastDay && App.lastDay !== k) { App.lastDay = k; MiniCal.month = startOfMonth(now); App.refresh(); return; }
  App.lastDay = k;
  const v = Views[App.view]; if (v && v.tick) v.tick(now);
}
async function init() {
  Settings.load(); applyTheme();
  Nav.build();
  await DB.open();
  await Data.loadAll();
  if (!S.meta.toolsSeeded) {
    const add = DEFAULT_TOOLS.filter(t => !S.tools.some(x => x.href === t.href)).map(t => ({ ...t, created: nowISO(), updated: nowISO() }));
    S.tools.push(...add); try { await DB.putMany('tools', add); } catch (e) { /* weiter */ }
    S.meta.toolsSeeded = { id: 'toolsSeeded', v: true }; Data.saveMeta('toolsSeeded');
  }
  await AutoBackup.init();
  MiniCal.bind(); MiniCal.render();
  const hv = location.hash.slice(1);
  App.go(Views[hv] ? hv : 'today', {}, { push: false });
  SaveState.set('saved');
  if (DB.mode !== 'idb') toast(DB.mode === 'local' ? 'IndexedDB nicht verfügbar – nutze begrenzten Browser-Speicher.' : 'Speichern nicht möglich – bitte Backups exportieren!', { timeout: 8000 });
  if (!Settings.data.onboarded) setTimeout(() => Onboarding.open(), 500);
  setInterval(tick, 1000);
  window.addEventListener('resize', debounce(() => { Nav.update(); initSegs(document); if (App.view === 'review') Views.review.drawCharts(false); if (App.view === 'routines') Views.routines.after(document, false); }, 180));
  const flush = () => { Views.notes.saveNow && Views.notes.saveNow(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  window.addEventListener('pagehide', flush);
}
init().catch(err => {
  console.error(err);
  document.getElementById('view').innerHTML = `<div class="card" style="margin-top:40px"><h2>Da ist etwas schiefgelaufen</h2><p class="muted" style="margin-top:8px">${esc(err && err.message)}</p><p class="small faint" style="margin-top:8px">Tipp: Seite neu laden. Wenn das Problem bleibt, exportiere unter Einstellungen ein Backup.</p></div>`;
});
</script>
